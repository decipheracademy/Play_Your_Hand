function pack(s,id){if(s.locked)return false;const item=ITEMS.slice(0,BANDS[s.band].pool).find(i=>i.id===id);if(!item)return false;const at=s.inventory.indexOf(id);if(at>=0){s.inventory.splice(at,1);return true;}if(capacity(s)+item.slots>BANDS[s.band].capacity)return false;s.inventory.push(id);return true;}
function lock(s){s.locked=true;}
function score(s,kind,amount,label){s[kind]+=amount;s.log.push({kind,amount,label});}
function drain(s,amount){const before=s.energy;s.energy=Math.max(0,s.energy-amount);if(before>0&&s.energy===0){score(s,'penalties',100,'Energy reached zero');s.fatigued=true;}}
function damage(s,amount){s.health=Math.max(0,s.health-amount);s.injured=s.health<100;if(s.health===0){score(s,'penalties',75,'Safe checkpoint rescue');s.rescueSeconds+=20;s.rescues++;/* Rescue leaves Health at zero. A safe checkpoint and a speed floor keep all paths playable. */return true;}return false;}
function enterEvent(s,event){s.eventSerial++;s.activeGear.clear();if(event==='injury')return damage(s,50);return false;}
function meaningful(s,id,context){
 if(id==='water')return s.energy<=70;
 if(id==='food')return s.energy<=80;
 if(id==='aid')return s.health<=50;
 if(id==='shoes')return ['bridge','tree'].includes(context);
 if(id==='compass')return !!context;
 if(id==='matches')return context==='camp';
 if(id==='fuel')return context==='dark'&&s.inventory.includes('light');
 return EVENTS[context]?.gear.includes(id)??false;
}
function useItem(s,id,context){
 if(!s.locked||!s.inventory.includes(id))return {ok:false};
 const once=['water','food','aid'].includes(id);const key=`${s.eventSerial}:${id}`;
 if(!once&&s.used.has(key))return {ok:false,repeat:true};
 const good=meaningful(s,id,context);
 if(good){score(s,'resource',20,`Meaningful ${id}`);s.activeGear.add(id);}else score(s,'penalties',30,`Unnecessary ${id}`);
 if(id==='water')s.energy=Math.min(100,s.energy+30);
 if(id==='food')s.energy=Math.min(100,s.energy+20);
 if(id==='aid'){s.health=Math.min(100,s.health+50);s.injured=s.health<100;}
 s.fatigued=s.energy===0;
 if(once)s.inventory.splice(s.inventory.indexOf(id),1);else if(good)s.used.add(key);
 return {ok:true,good,opens:good&&(EVENTS[context]?.gear.includes(id)??false)};
}
function shortcut(s,rng=Math.random){const route=ROUTES[s.route];const success=rng()<(s.inventory.includes(route.gear)?.9:.5);if(success)score(s,'adaptation',75,'Risky shortcut');else damage(s,25);return success;}
function eventSequence(s,rng=Math.random){const b=BANDS[s.band],n=b.events[0]+Math.floor(rng()*(b.events[1]-b.events[0]+1));const first=ROUTES[s.route].event;const all=Object.keys(EVENTS);const sequence=[first];for(let i=1;i<n;i++){const candidates=all.filter(e=>e!==sequence[i-1]);const weighted=candidates.flatMap(e=>['storm','injury'].includes(e)?[e,e,e,e]:[e]);sequence.push(weighted[Math.floor(rng()*weighted.length)]);}return sequence;}
function breakdown(s,seconds=s.elapsed){const target=BANDS[s.band].times.reduce((a,b)=>a+b,0),time=seconds+s.rescueSeconds;const progress=Math.min(600,s.progress),resource=Math.min(300,s.resource),adaptation=Math.min(200,s.adaptation),timeBonus=Math.round(150*Math.max(0,Math.min(1,1-(time-target)/(target*.25))));return {progress,resource,adaptation,timeBonus,penalties:s.penalties,total:progress+resource+adaptation+timeBonus-s.penalties,seconds:time};}
function speedFactor(s){return (s.energy===0?.5:1)*(s.injured?.8:1);}

function how(){mode='how';const steps=[['🎒','Pack','Tap or drag supplies into your backpack. Lock it when you’re ready.'],['🧭','Navigate','Tap the path, use the arrow keys, or hold the movement buttons.'],['⛈️','Adapt','Use a supply near an obstacle, or walk another path to the Lighthouse.']];const step=steps[walkthrough];shell(`<section class="panel-wrap"><div class="panel" id="howPanel"><p class="eyebrow">HOW TO PLAY · ${walkthrough+1} / 3</p><div class="instructions"><span class="big-icon" aria-hidden="true">${step[0]}</span><h2>${step[1]}</h2><p>${step[2]}</p></div><div class="steps">${steps.map((_,i)=>`<i class="step-dot ${i===walkthrough?'active':''}"></i>`).join('')}</div><div class="row"><button class="ghost" id="howBack">${walkthrough?'Previous':'Main Menu'}</button><button class="primary" id="howNext">${walkthrough===2?'Ready!':'Next →'}</button></div></div></section>`);$('#howBack').onclick=()=>{if(walkthrough){walkthrough--;how();}else menu();};$('#howNext').onclick=()=>{if(walkthrough<2){walkthrough++;how();}else menu();};let start=0;$('#howPanel').ontouchstart=e=>start=e.changedTouches[0].clientX;$('#howPanel').ontouchend=e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>65){walkthrough=Math.max(0,Math.min(2,walkthrough+(d<0?1:-1)));how();}};}

async function story(){mode='story';beat=1;const id=++storyId;shell(`<section class="story"><canvas aria-label="Animated journey to Sunstone Island"></canvas><button class="skip" id="skip">Skip story →</button><div class="narrative"><span class="beat-tag" id="beatTag"></span><div id="lines"></div></div></section>`);bindCanvas();$('#skip').onclick=()=>{storyId++;packScreen();};for(let i=0;i<storyLines.length;i++){if(id!==storyId)return;beat=i+1;sceneTime=0;$('#beatTag').textContent=`SUNSTONE ISLAND · ${beat} / 6`;$('#lines').innerHTML='';const sceneAnimation=canvas.animate(prefs.reduced?[{opacity:.85},{opacity:1}]:[{transform:'scale(1.02) translateX(-1%)'},{transform:'scale(1.05) translateX(0)'}],{duration:storyLines[i].join(' ').length*36+1600,fill:'forwards',easing:'ease-out'});for(const line of storyLines[i]){if(id!==storyId)return;const p=document.createElement('p');p.textContent=line;$('#lines').append(p);const animation=p.animate([{opacity:0,transform:prefs.reduced?'none':'translateY(8px)',offset:0},{opacity:1,transform:'none',offset:.15},{opacity:1,transform:'none',offset:1}],{duration:Math.max(1800,line.length*36),fill:'both'});await animation.finished.catch(()=>{});}await sceneAnimation.finished.catch(()=>{});}if(id===storyId)packScreen();}

function review(){const d=document.createElement('dialog');d.innerHTML=`<h2>Review your pack</h2><p>${s.inventory.length?s.inventory.map(id=>esc(ITEMS.find(i=>i.id===id).name)).join(' · '):'Your backpack is empty. You can still take the longer paths.'}</p><p><strong>${capacity(s)} / ${BANDS[s.band].capacity} slots</strong><br>This lock is one-way. Ready to set off?</p><div class="row"><button class="ghost" id="goBack">Go Back</button><button class="primary" id="confirmLock">Confirm</button></div>`;app.append(d);d.showModal();$('#goBack').onclick=()=>d.remove();$('#confirmLock').onclick=()=>{lock(s);sfx('lock');d.remove();transition(1);};d.addEventListener('cancel',()=>d.remove());}
function transition(round){mode='transition';key={};shell(`<section class="panel-wrap transition"><div class="panel"><div class="big-icon">${round===1?'🎒':'🏝️'}</div><p class="eyebrow">ROUND ${round} COMPLETE</p><h2>${round===1?'Backpack locked.':'Across the island.'}</h2><p class="muted">${round===1?'Your choices are coming with you.':'The Lighthouse is closer. The island is changing.'}</p><div class="recap">${s.inventory.map(id=>{const i=ITEMS.find(i=>i.id===id);return `<span>${i.icon} ${i.name}</span>`;}).join('')||'<span>Empty backpack · find your own way</span>'}</div><button class="primary" id="continue">${round===1?'Cross the island →':'See what lies ahead →'}</button></div></section>`);$('#continue').onclick=()=>{if(round===1){s.round=2;section=0;roundStart=s.elapsed;startTravel(true);}else{s.round=3;roundStart=s.elapsed;eventList=eventSequence(s);s.routeChangesTarget=BANDS[s.band].changes[0]+(eventList.length>BANDS[s.band].events[0]?BANDS[s.band].changes[1]-BANDS[s.band].changes[0]:0);eventIndex=0;startTravel();}};}
function startTravel(fork=false){mode='travel';mood=s.round===2?'travel':'events';key={};roundElapsed=s.elapsed-roundStart;const event=fork?null:s.round===2?ROUTES[s.route].event:eventList[eventIndex];const changes=s.round===3?Math.min(eventIndex,s.routeChangesTarget||0):0;g={detourY:changes%2?515:150,routeChanges:changes,...WORLD.start,fork,routes:ROUTES,event,blocked:!!event&&!['storm','injury'].includes(event),opened:false,moving:false,target:null,path:[],checkpoint:{...WORLD.start},tokens:[{x:240,y:310,collected:false},{x:690,y:320,collected:false}],shortcutAvailable:s.round===2&&section===1,final:s.round===3&&eventIndex===eventList.length-1,compass:false,sheltered:false,campFire:false,efficient:false,detoured:false,delayedApplied:false};if(!fork){const rescued=enterEvent(s,event);if(rescued)g.rescueMessage=true;sfx('event');}renderTravel();if(g.rescueMessage)note('Rescued to a safe checkpoint. +20 seconds, −75 points. You can keep going.');else if(event==='injury')note('You hurt your ankle: −50 Health. First aid helps, or keep moving carefully.');else if(s.round===3&&s.band>=4&&s.delayedDrain>0){const debt=s.delayedDrain;s.delayedDrain=0;drain(s,debt);note('The earlier detour catches up with you: your energy reserve is lower.');}else if(event)note(EVENTS[event].hint);}
function renderTravel(){shell(`<div class="travel-head"><div class="travel-title"><span class="round-pill">ROUND ${s.round} / 3 · ${s.round===2?'CROSS THE ISLAND':'THE ISLAND CHANGES'}</span><h2>${g.fork?'Choose your path.':s.round===2?ROUTES[s.route].name+' trail':EVENTS[g.event].name}</h2></div><div class="meters"><div class="meter"><label for="energy">Energy <span id="energyValue"></span></label><progress id="energy" max="100" value="100"></progress></div><div class="meter health"><label for="health">Health <span id="healthValue"></span></label><progress id="health" max="100" value="100"></progress></div></div><div class="timer"><strong id="timer"></strong><span id="timerLabel"></span></div></div><div class="world-wrap"><canvas id="world" tabindex="0" aria-label="Island path. Use arrow keys or movement buttons. Tap a sign to walk a route, collect gold tokens, and use supplies near obstacles."></canvas><div class="world-banner" id="worldBanner">${g.fork?'Walk to a wooden sign to choose your route.':s.round===2?`Trail ${section+1} / 3 · Walk to the right-hand sign`:`Event ${eventIndex+1} / ${eventList.length}${g.routeChanges?' · Path shift '+g.routeChanges:''} · ${g.final?'Reach the Lighthouse':'Follow the onward sign'}`}</div></div><div class="inventory-bar" id="inventory" aria-label="Locked backpack"></div><div class="controls"><div class="control-copy"><p id="travelNote" role="status"></p><p>Tap to walk · arrow keys / WASD · hold the buttons</p><div class="route-help" id="routeHelp"></div></div><div class="dpad" aria-label="Movement controls"><button data-dir="ArrowUp" aria-label="Move up">▲</button><button data-dir="ArrowLeft" aria-label="Move left">◀</button><button data-dir="ArrowDown" aria-label="Move down">▼</button><button data-dir="ArrowRight" aria-label="Move right">▶</button></div></div>`);bindCanvas();renderInventory();renderRouteHelp();updateHUD();canvas.onpointerdown=e=>{audioStart();const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*600;if(g.fork){if(x>430){const i=[120,240,380,500].reduce((best,v,j)=>Math.abs(v-y)<Math.abs([120,240,380,500][best]-y)?j:best,0);chooseRoute(Object.keys(ROUTES)[i]);}else setTarget(x,y);return;}if(Math.hypot(x-330,y-(g.detourY===515?480:115))<100){detour();return;}if(g.shortcutAvailable&&Math.hypot(x-720,y-485)<90){goShortcut();return;}setTarget(x,y);};document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key[b.dataset.dir]=true;g.target=null;g.path=[];};b.onpointerup=b.onpointercancel=()=>key[b.dataset.dir]=false;b.onlostpointercapture=()=>key[b.dataset.dir]=false;});}

function activate(id){if(mode!=='travel')return;let context=null;const consumable=['water','food','aid'].includes(id);if(id==='matches'&&g.event==='storm'&&Math.hypot(g.x-297,g.y-460)<95)context='camp';else if(id==='compass'&&!g.fork)context=g.event;else if(id==='shoes'&&!g.fork)context=g.event;else if(!g.fork&&(Math.hypot(g.x-440,g.y-350)<180||['storm','injury'].includes(g.event)))context=g.event;const r=useItem(s,id,context);if(!r.ok){note(r.repeat?'Already used here. Save your next action for another obstacle.':'That supply is no longer in your pack.');return;}if(r.good){if(r.opens){g.blocked=false;g.opened=true;if(!g.efficient){score(s,'adaptation',50,'Obstacle completed efficiently');g.efficient=true;}note('A clever use of supplies! The way is clear.');}else note(`${ITEMS.find(i=>i.id===id).name} helped. +20 Resource Efficiency`);if(id==='compass'){g.compass=true;g.path=g.x>560?[{x:930,y:350}]:[{x:310,y:350},{x:375,y:205},{x:560,y:205},{x:640,y:350},{x:930,y:350}];nextTarget();}if(id==='matches'){g.campFire=true;g.sheltered=true;}}else note('That supply wasn’t needed here. −30 points for unnecessary use.');sfx();renderInventory();updateHUD();}
function updateHUD(){if(!s)return;if($('#energy')){$('#energy').value=s.energy;$('#energyValue').textContent=Math.ceil(s.energy);$('#health').value=s.health;$('#healthValue').textContent=Math.ceil(s.health);}if($('#timer')){const elapsed=mode==='pack'?s.elapsed:s.elapsed-roundStart;const target=BANDS[s.band].times[s.round-1];const over=elapsed>target;$('#timer').textContent=over?`+${time(elapsed-target)}`:time(target-elapsed);$('#timerLabel').textContent=over?'Keep going · soft target':mode==='pack'?'packing target':'round target';}}
function step(dt){if(mode!=='travel'||!g)return;let dx=0,dy=0;const keyboard=key.ArrowLeft||key.ArrowRight||key.ArrowUp||key.ArrowDown||key.a||key.d||key.w||key.s;if(keyboard){g.target=null;g.path=[];dx=(key.ArrowRight||key.d?1:0)-(key.ArrowLeft||key.a?1:0);dy=(key.ArrowDown||key.s?1:0)-(key.ArrowUp||key.w?1:0);}else if(g.target){dx=g.target.x-g.x;dy=g.target.y-g.y;const distance=Math.hypot(dx,dy);if(distance<4){g.x=g.target.x;g.y=g.target.y;nextTarget();dx=0;dy=0;}}
const dist=Math.hypot(dx,dy);g.moving=dist>0;if(dist>0){const base=s.round===2?(g.fork?105:2520/BANDS[s.band].times[1]/ROUTES[s.route].length):850*eventList.length/BANDS[s.band].times[2];let speed=base*speedFactor(s);const rough=['tree','bridge'].includes(g.event);if(rough&&!s.activeGear.has('shoes'))speed*=.85;if(g.event==='storm'&&!g.sheltered&&!s.activeGear.has('jacket')&&!s.activeGear.has('blanket'))speed*=.8;const amount=Math.min(dist,speed*dt);const nx=g.x+dx/dist*amount,ny=g.y+dy/dist*amount;let moved=0;if(canMove(nx,ny,g.blocked)){moved=Math.hypot(nx-g.x,ny-g.y);g.x=nx;g.y=ny;}else{if(canMove(nx,g.y,g.blocked)){moved+=Math.abs(nx-g.x);g.x=nx;}if(canMove(g.x,ny,g.blocked)){moved+=Math.abs(ny-g.y);g.y=ny;}if(!moved&&!keyboard){g.target=null;g.path=[];note('The direct path is blocked. Use a supply nearby, or follow the land path.');}}
